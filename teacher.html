  <style>
    .detail-hero{background:linear-gradient(135deg,#0F172A,#1D4ED8);color:white;padding:54px 0 90px;position:relative;overflow:hidden}.detail-hero:before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,rgba(96,165,250,.25),transparent 45%);pointer-events:none}.detail-hero .container{position:relative;z-index:1}.detail-card{background:white;border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);padding:30px;margin-top:-52px;position:relative}.teacher-mini{display:flex;align-items:center;gap:14px;background:var(--bg-light);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin:20px 0}.mini-avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--sky));color:white;display:flex;align-items:center;justify-content:center;font-family:Cairo,sans-serif;font-weight:800;font-size:1.3rem;overflow:hidden;flex-shrink:0}.mini-avatar img{width:100%;height:100%;object-fit:cover}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.detail-item{background:var(--bg-light);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px}.detail-label{font-size:.78rem;color:var(--text-muted);margin-bottom:4px}.detail-value{font-weight:800;font-family:Cairo,sans-serif}.contact-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.description-box{line-height:1.9;color:var(--text-secondary);font-size:1rem;background:white;border-top:1px solid var(--border-light);padding-top:20px;overflow-wrap:anywhere;word-break:break-word}@media(max-width:760px){.detail-grid{grid-template-columns:1fr 1fr}.detail-card{padding:20px}.teacher-mini{align-items:flex-start}}@media(max-width:460px){.detail-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<nav class="navbar">
  <div class="nav-container" style="max-width:1200px;margin:0 auto">
    <a href="index.html" class="nav-brand"><img src="logo.png" alt="مدرسك" class="site-logo"> مدرسك</a>
    <div class="nav-actions"><a href="index.html" class="btn btn-ghost btn-sm">← الرئيسية</a></div>
  </div>
</nav>
<section class="detail-hero">
  <div class="container">
    <a href="javascript:history.back()" style="color:rgba(255,255,255,.85);display:inline-block;margin-bottom:18px">← رجوع</a>
    <div id="hero-loading" class="text-center" style="padding:20px"><div class="spinner-lg" style="border-top-color:white"></div></div>
    <div id="hero-content" style="display:none"></div>
  </div>
</section>
<main class="container" style="padding-bottom:60px">
  <div id="detail-content" style="display:none"></div>
  <div id="not-found" class="empty-state" style="display:none;margin-top:40px">
    <div class="empty-icon">😕</div><div class="empty-title">الإعلان غير موجود</div><div class="empty-text">ربما تم حذفه أو لم تتم الموافقة عليه بعد.</div>
    <a href="index.html" class="btn btn-primary mt-16">العودة للرئيسية</a>
  </div>
</main>
<footer class="footer" style="margin-top:0"><div class="container"><div class="footer-bottom" style="border-top:none;margin-top:0">© 2026 مدرسك — جميع الحقوق محفوظة · <a href="privacy.html">سياسة الخصوصية</a> · <a href="terms.html">شروط الاستخدام</a></div></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=6.3"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(location.search);
    const adId = params.get('ad');
    const teacherId = params.get('id');
    if (adId) return loadAdDetails(adId);
    if (teacherId) return loadFirstTeacherAd(teacherId);
    showNotFound();
  });

  async function loadFirstTeacherAd(teacherId){
    try{
      const {data, error}=await supabase.from('ads').select('id, teachers(is_active, subscription_status, subscription_end)').eq('teacher_id', teacherId).eq('status','active').order('created_at',{ascending:false}).limit(10);
      const first=(data||[]).find(x=>isSubscriptionActive(x.teachers));
      if(error || !first) return showNotFound();
      location.replace(`teacher.html?ad=${first.id}`);
    }catch(e){showNotFound();}
  }

  async function loadAdDetails(adId){
    try{
      const {data: ad, error}=await supabase
        .from('ads')
        .select('*, teachers(id, name, bio, avatar_url, whatsapp, facebook, phone, contact_methods, is_active, plan_type, subscription_status, subscription_end)')
        .eq('id', adId)
        .eq('status','active')
        .single();
      if(error || !ad || !isSubscriptionActive(ad.teachers)) return showNotFound();
      trackEvent('ad_detail_view', {ad_id: ad.id, teacher_id: ad.teacher_id, page:'teacher.html'});
      renderAd(ad);
    }catch(e){console.error(e);showNotFound();}
  }

  function renderAd(ad){
    const t=ad.teachers || {};
    document.getElementById('hero-loading').style.display='none';
    document.getElementById('hero-content').style.display='';
    document.getElementById('hero-content').innerHTML=`
      <div style="color:#BFDBFE;font-weight:700;margin-bottom:8px">📋 تفاصيل الإعلان</div>
      <h1 style="font-family:Cairo,sans-serif;font-size:clamp(1.8rem,4vw,2.7rem);font-weight:900;margin-bottom:10px">${escapeHtml(ad.title || ad.subject)}</h1>
      <p style="color:#CBD5E1">${escapeHtml(ad.subject)} • ${escapeHtml(ad.grade)} • ${lessonTypeLabel(ad.lesson_type)}</p>`;

    const initial=getInitials(t.name);
    const avatar=t.avatar_url?`<img src="${escapeHtml(t.avatar_url)}" alt="${escapeHtml(t.name)}" onerror="this.style.display='none'">`:initial;
    const contacts=buildContactButtons(t, ad, '');
    document.getElementById('detail-content').style.display='';
    document.getElementById('detail-content').innerHTML=`
      <article class="detail-card animate-in">
        ${ad.main_image_url ? `<button class="image-open-btn" type="button" onclick="openImageViewer('${escapeHtml(ad.main_image_url)}','${escapeHtml(ad.title || ad.subject)}')">${mediaImage(ad.main_image_url, ad.title || ad.subject, 'ad-main-detail-image')}</button>` : ''}
        <div class="teacher-mini">
          <div class="mini-avatar">${avatar}</div>
          <div style="flex:1">
            <div style="font-family:Cairo,sans-serif;font-weight:800;font-size:1.15rem">${escapeHtml(t.name || 'مدرس')}</div>
            <div style="color:var(--text-secondary);font-size:.92rem">${escapeHtml(t.bio || 'مدرس على منصة مدرسك')}</div>
          </div>
        </div>
        <div class="detail-grid">
          <div class="detail-item"><div class="detail-label">المادة</div><div class="detail-value">${escapeHtml(ad.subject)}</div></div>
          <div class="detail-item"><div class="detail-label">الصف/المرحلة</div><div class="detail-value">${escapeHtml(ad.grade)}</div></div>
          <div class="detail-item"><div class="detail-label">نوع الدرس</div><div class="detail-value">${lessonTypeLabel(ad.lesson_type)}</div></div>
          <div class="detail-item"><div class="detail-label">السعر</div><div class="detail-value" style="color:var(--primary)">${formatPrice(ad.price)} / الحصة</div></div>
        </div>
        <div class="description-box">
          <h3 style="margin-bottom:10px;color:var(--text-primary)">وصف الإعلان</h3>
          ${ad.description ? nl2br(ad.description) : 'لا يوجد وصف إضافي.'}
        </div>
        ${normalizeList(ad.gallery_images).length ? `
          <div class="description-box">
            <h3 style="margin-bottom:10px;color:var(--text-primary)">صور إضافية</h3>
            <div class="gallery-grid">${normalizeList(ad.gallery_images).map(url => `<button class="image-open-btn" type="button" onclick="openImageViewer('${escapeHtml(url)}','صورة إضافية للإعلان')">${mediaImage(url, 'صورة إضافية للإعلان')}</button>`).join('')}</div>
          </div>` : ''}
        ${normalizeList(ad.video_links).length ? `
          <div class="description-box">
            <h3 style="margin-bottom:10px;color:var(--text-primary)">فيديوهات الإعلان</h3>
            <div class="video-list">${normalizeList(ad.video_links).map(videoEmbedHtml).join('')}</div>
          </div>` : ''}
        <div class="contact-row">${contacts.join('') || '<span style="color:var(--text-muted)">لا توجد وسائل تواصل متاحة</span>'}</div>
      </article>`;
  }
  function showNotFound(){document.getElementById('hero-loading').style.display='none';document.getElementById('hero-content').style.display='';document.getElementById('hero-content').innerHTML='<h1 style="font-family:Cairo,sans-serif">الإعلان غير موجود</h1>';document.getElementById('not-found').style.display='';}
</script>
</body>
</html>
